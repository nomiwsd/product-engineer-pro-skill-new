name: Weekly version freshness

# GitHub disables scheduled workflows after 60 days without repository activity.
# If this job stops running, re-enable it from the Actions tab.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Check snapshot age and official release lines
        id: freshness
        continue-on-error: true
        run: node scripts/check-freshness.mjs --markdown > freshness-report.md
      - name: Publish the report to the job summary
        if: always()
        run: cat freshness-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update a tracked drift issue
        if: steps.freshness.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING="$(gh issue list --state open --search 'Product Engineer Pro freshness drift in:title' --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file freshness-report.md
          else
            gh issue create --title "Product Engineer Pro freshness drift" --body-file freshness-report.md
          fi
      - name: Fail on blocking findings
        if: steps.freshness.outcome == 'failure'
        run: exit 1
