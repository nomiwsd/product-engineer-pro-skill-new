name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Validate Skill & Package
    runs-on: ubuntu-latest

    # Node policy: COMPATIBILITY.md. 18 is the declared minimum (legacy compatibility);
    # 22, 24, and 26 are the supported LTS lines.
    strategy:
      matrix:
        node-version: [18.x, 22.x, 24.x, 26.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Validate Package Structure
        run: npm test

      - name: Verify CLI Executable
        run: node bin/cli.js --help

      - name: Fail if the checks changed tracked files
        shell: bash
        run: |
          git status --porcelain
          git diff --exit-code
          test -z "$(git status --porcelain)"

  website:
    name: Clean offline-capable website build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Clean install
        working-directory: website
        run: npm ci
      - name: Lint
        working-directory: website
        run: npm run lint
      - name: Type-check
        working-directory: website
        run: npm run typecheck
      - name: Production build without remote font fetches
        working-directory: website
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  package-smoke:
    name: Packed tarball installs and runs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Pack, install, and run the CLI from the tarball
        run: npm run smoke:pack
