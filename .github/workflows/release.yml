name: Publish to NPM

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version Bump Type (patch, minor, major, or none)"
        required: false
        default: "none"
        type: choice
        options:
          - patch
          - minor
          - major
          - none

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish-npm:
    name: Publish @nomiwsd/product-engineer-pro to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      # npm Trusted Publishing requires npm >= 11.5.1 and Node.js >= 22.14.0.
      - name: Install OIDC-compatible npm
        run: npm install --global npm@11.6.2

      - name: Verify publishing prerequisites
        shell: bash
        run: |
          REGISTRY="$(npm config get registry)"
          echo "Node.js $(node --version)"
          echo "npm $(npm --version)"
          echo "Registry: ${REGISTRY}"

          if [[ "${REGISTRY}" != "https://registry.npmjs.org/" ]]; then
            echo "::error::Unexpected npm registry: ${REGISTRY}"
            exit 1
          fi

      - name: Auto Bump Version & Sync
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bump_type != 'none' }}
        run: |
          npm version "${{ inputs.bump_type }}" --no-git-tag-version
          node scripts/sync-version.mjs --fix

      - name: Commit & Push Version Bump
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bump_type != 'none' }}
        run: |
          git add package.json bin/cli.js CHANGELOG.md
          git commit -m "chore(release): auto-bump package version [skip ci]"
          git push origin HEAD:main

      - name: Run Tests & Validations
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish to NPM Registry
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
